<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Komunyon</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3efe6;
        color: #1b1914;
        font-family: Georgia, 'Times New Roman', serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem 1.25rem;
        max-width: 28rem;
      }
      p {
        margin: 0.75rem 0 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #6f675e;
      }
      button {
        margin-top: 1.5rem;
        height: 2.75rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 0.375rem;
        background: #1b4c55;
        color: white;
        font: inherit;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Komunyon</h1>
      <p>You are offline. The studies will show again when this phone has a connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
